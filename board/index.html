<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent 看板</title>
<style>
  /* ========== 颜色：浅色 / 深色跟随系统 ========== */
  :root {
    --bg: #f4f3ef; --surface: #ffffff; --surface-2: #f8f7f4; --text: #1c1b19; --muted: #77746d;
    --faint: #a9a59c; --line: #e6e3dc; --shadow: 0 1px 2px rgba(30,25,15,.05), 0 4px 16px rgba(30,25,15,.05);
    --run: #1f9d55; --run-bg: #e4f5ea; --done: #2f63d6; --done-bg: #e6edfb;
    --bad: #cf3c3c; --bad-bg: #fbe7e7; --amber: #b26a00; --amber-bg: #fdf0da; --gray-bg: #efede8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413; --surface: #1f1e1c; --surface-2: #262522; --text: #ecebe7; --muted: #a19d94;
      --faint: #6f6b63; --line: #33312d; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
      --run: #43d07f; --run-bg: #173523; --done: #7aa2ff; --done-bg: #1c2742;
      --bad: #ff7070; --bad-bg: #3d1d1d; --amber: #f0b04f; --amber-bg: #3a2b12; --gray-bg: #2a2926;
    }
  }

  /* ========== 基础排版 ========== */
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
         -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 20px 60px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
  button { font: inherit; color: inherit; cursor: pointer; }
  .muted { color: var(--muted); }
  pre { white-space: pre-wrap; word-break: break-word; font: 12.5px/1.6 ui-monospace, "SF Mono", Menlo, monospace; margin: 0; }

  /* ========== 顶栏 ========== */
  .top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px 16px; flex-wrap: wrap; }
  .eyebrow { font-size: 12px; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
  h1 { font-size: 24px; line-height: 1.3; margin: 2px 0 0; letter-spacing: -.01em; }
  .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  select { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--line);
           border-radius: 10px; padding: 6px 10px; max-width: 240px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .pill.live { background: var(--run-bg); color: var(--run); }
  .pill.dead { background: var(--bad-bg); color: var(--bad); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; display: inline-block; flex: none; }
  .pulse { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .3; } }

  /* ========== 健康条 ========== */
  .health { display: flex; gap: 8px; flex-wrap: wrap; margin: 16px 0 6px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 10px; font-size: 12.5px;
          background: var(--surface); border: 1px solid var(--line); }
  .chip b { font-weight: 600; white-space: nowrap; }
  .chip { flex-wrap: wrap; white-space: nowrap; }
  .chip span { color: var(--muted); }
  .chip.ok .dot { color: var(--run); } .chip.warn .dot { color: var(--amber); } .chip.bad .dot { color: var(--bad); }
  .chip.unk .dot { color: var(--faint); }
  .chip.bad { border-color: var(--bad); }
  .meter { width: 46px; height: 5px; border-radius: 5px; background: var(--line); overflow: hidden; }
  .meter i { display: block; height: 100%; background: var(--run); }
  .chip.warn .meter i { background: var(--amber); } .chip.bad .meter i { background: var(--bad); }

  /* ========== 分区标题 ========== */
  section { margin-top: 26px; }
  h2 { font-size: 15px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
  h2 .n { font-size: 12px; font-weight: 600; color: var(--muted); background: var(--gray-bg); padding: 0 8px; border-radius: 999px; }
  .calm { padding: 14px 16px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .calm .dot { color: var(--run); }

  /* ========== ① 要你处理 ========== */
  .attn { display: flex; flex-direction: column; gap: 8px; }
  .item { display: grid; grid-template-columns: 4px 1fr auto; gap: 0 14px; padding: 12px 14px 12px 0; overflow: hidden; }
  .item .bar { border-radius: 0 4px 4px 0; }
  .item.red .bar { background: var(--bad); } .item.amber .bar { background: var(--amber); } .item.gray .bar { background: var(--faint); }
  .item .what { font-weight: 600; }
  .item .what small { font-weight: 400; color: var(--muted); margin-left: 6px; }
  .item .detail { color: var(--text); font-size: 13px; margin-top: 2px; word-break: break-word; }
  .item .todo { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .item .todo b { color: var(--text); font-weight: 600; }
  .item .acts { display: flex; gap: 6px; align-items: flex-start; }
  .btn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 3px 10px; font-size: 12.5px; white-space: nowrap; }
  .btn:hover { border-color: var(--faint); }
  .hidden-note { font-size: 12.5px; color: var(--muted); margin-top: 6px; }
  .linkbtn { border: 0; background: none; color: var(--done); padding: 0; font-size: inherit; }

  /* ========== ② 正在干活 ========== */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
  .run { padding: 14px 16px; cursor: pointer; transition: border-color .15s; min-width: 0; }
  .run:hover { border-color: var(--faint); }
  .run .head { display: flex; justify-content: space-between; gap: 4px 8px; align-items: center; flex-wrap: wrap; min-width: 0; }
  .run .head > * { min-width: 0; }
  .who { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--run);
         background: var(--run-bg); padding: 2px 9px; border-radius: 999px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .who.idle { color: var(--muted); background: var(--gray-bg); }
  .proj { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .run .title { font-weight: 600; margin: 8px 0 10px; line-height: 1.4; }
  .prog { height: 5px; border-radius: 5px; background: var(--line); overflow: hidden; }
  .prog i { display: block; height: 100%; background: var(--run); transition: width 1s linear; }
  .prog.late i { background: var(--amber); }
  .run .times { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 5px; font-variant-numeric: tabular-nums; }
  .run .step { font-size: 12.5px; margin-top: 8px; color: var(--text); background: var(--surface-2); border-radius: 8px; padding: 6px 9px;
               overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: break-all; }
  .run .step b { color: var(--muted); font-weight: 600; }

  /* ========== ③ 最近完成 ========== */
  .list { overflow: hidden; }
  .row { display: grid; grid-template-columns: 74px 1fr 84px 110px 86px; gap: 12px; align-items: center; padding: 11px 16px;
         border-top: 1px solid var(--line); cursor: pointer; }
  .row:first-child { border-top: 0; }
  .row:hover { background: var(--surface-2); }
  .row .title { font-weight: 600; line-height: 1.4; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .sub { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .num { font-size: 12.5px; text-align: right; font-variant-numeric: tabular-nums; line-height: 1.4; }
  .row .num span { color: var(--muted); font-size: 12px; }
  .row .when { font-size: 12px; color: var(--muted); text-align: right; }
  .badge { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; text-align: center; white-space: nowrap; }
  .badge.ok { background: var(--run-bg); color: var(--run); }
  .badge.bad { background: var(--bad-bg); color: var(--bad); }
  .badge.wait { background: var(--amber-bg); color: var(--amber); }
  .badge.run { background: var(--done-bg); color: var(--done); }
  .more { padding: 10px 16px; border-top: 1px solid var(--line); font-size: 13px; }

  /* ========== 详情抽屉 ========== */
  .shade { position: fixed; inset: 0; background: rgba(0,0,0,.25); opacity: 0; pointer-events: none; transition: opacity .2s; }
  .shade.on { opacity: 1; pointer-events: auto; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(680px, 100vw); background: var(--surface);
            border-left: 1px solid var(--line); box-shadow: -8px 0 30px rgba(0,0,0,.12); transform: translateX(102%);
            transition: transform .22s ease; display: flex; flex-direction: column; }
  .drawer.on { transform: none; }
  .dh { padding: 16px 20px 0; }
  .dh .x { float: right; border: 0; background: var(--surface-2); border-radius: 8px; width: 30px; height: 30px; font-size: 16px; }
  .dh h3 { margin: 0 40px 4px 0; font-size: 17px; line-height: 1.4; }
  .dh .meta { font-size: 12.5px; color: var(--muted); display: flex; gap: 6px 12px; flex-wrap: wrap; align-items: center; }
  .rounds { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
  .rchip { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 3px 10px; font-size: 12.5px; display: inline-flex; gap: 6px; align-items: center; }
  .rchip.on { border-color: var(--text); background: var(--surface); font-weight: 600; }
  .rchip.done .dot, .rchip.ok .dot { color: var(--run); } .rchip.running .dot { color: var(--done); }
  .rchip.timeout .dot, .rchip.failed .dot, .rchip.interrupted .dot, .rchip.bad .dot { color: var(--bad); }
  .facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px 14px; margin-top: 12px; font-size: 12.5px; }
  .facts div span { display: block; color: var(--muted); font-size: 12px; }
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-top: 14px; overflow-x: auto; }
  .tab { border: 0; background: none; padding: 8px 12px; font-size: 13.5px; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
  .tab.on { color: var(--text); border-bottom-color: var(--text); font-weight: 600; }
  .db { flex: 1; overflow: auto; padding: 16px 20px 40px; }
  .box { border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; font-size: 13px; }
  .box.amber { background: var(--amber-bg); } .box.blue { background: var(--done-bg); } .box.gray { background: var(--surface-2); }
  .box h4 { margin: 0 0 6px; font-size: 13px; }
  .tl { list-style: none; margin: 0; padding: 0; }
  .tl li { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; padding: 6px 0; border-top: 1px dashed var(--line); font-size: 13px; }
  .tl li:first-child { border-top: 0; }
  .tl .ic { text-align: center; }
  .tl .tm { font-size: 11.5px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .tl .s { word-break: break-word; white-space: pre-wrap; }
  .tl li.warn .s, .tl li.error .s { color: var(--bad); }
  .tl li.think .s { color: var(--muted); }
  .tl details { grid-column: 2 / 4; }
  .tl details summary { cursor: pointer; color: var(--muted); font-size: 12px; }
  .tl details pre { background: var(--surface-2); padding: 8px; border-radius: 8px; margin-top: 4px; max-height: 260px; overflow: auto; }
  .files { list-style: none; padding: 0; margin: 0; }
  .files li { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); font-size: 13px; }
  .files li:first-child { border-top: 0; }
  .doc { background: var(--surface-2); border-radius: 10px; padding: 12px; }
  .kv { font-size: 13px; }
  .kv div { padding: 6px 0; border-top: 1px solid var(--line); }
  .kv div:first-child { border-top: 0; }
  .kv span { color: var(--muted); font-size: 12px; margin-right: 8px; }

  /* ========== 窄屏 ========== */
  @media (max-width: 720px) {
    .wrap { padding: 16px 16px 48px; }
    .row { grid-template-columns: 62px 1fr auto; }
    .row .num.t, .row .num.c { display: none; }
    .grid { grid-template-columns: 1fr; }
    .item { grid-template-columns: 4px 1fr; }
    .item .acts { grid-column: 2; margin-top: 8px; }
  }
  /* 放弃属于已结束任务，用现有灰色调弱化结论，避免看成失败。 */
  .badge.gray { color: var(--muted); background: var(--bg); }
</style>
</head>
<body>
<div class="wrap">
  <!-- 顶栏：标题、项目切换、实时状态 -->
  <div class="top">
    <div>
      <div class="eyebrow">多 AGENT 协作</div>
      <h1>工作看板</h1>
    </div>
    <div class="controls">
      <select id="project" aria-label="选择项目"></select>
      <span id="live" class="pill live"><i class="dot pulse"></i>连接中…</span>
    </div>
  </div>
  <!-- ④ 健康条：额度、余额、安全（常驻，一眼扫过） -->
  <div id="health" class="health"></div>

  <!-- ① 要你处理 -->
  <section>
    <h2>要你处理 <span class="n" id="attn-n">0</span></h2>
    <div id="attn" class="attn"></div>
  </section>
  <!-- ② 正在干活 -->
  <section>
    <h2>正在干活 <span class="n" id="run-n">0</span></h2>
    <div id="running" class="grid"></div>
  </section>
  <!-- ③ 最近完成 -->
  <section>
    <h2>最近完成 <span class="n" id="rec-n">0</span><span class="muted" style="font-weight:400;font-size:12px">最近 14 天</span></h2>
    <div id="recent" class="card list"></div>
  </section>
</div>

<!-- 详情抽屉 -->
<div id="shade" class="shade"></div>
<aside id="drawer" class="drawer" aria-hidden="true">
  <div class="dh" id="dh"></div>
  <div class="db" id="db"></div>
</aside>

<script>
// ================= 1. 状态和小工具 =================
const S = {
  project: '全部',       // 当前项目
  data: null,            // /api/state 的最新结果
  lastOk: 0,             // 上次成功拿到数据的时间
  failing: false,        // 现在是不是连不上服务
  showAllRecent: false,  // "最近完成"是否展开全部
  open: null,            // 打开的抽屉：{id, round, tab}
  detail: null,          // 抽屉里的任务详情
  fileView: null,        // 文件页里正在看的文件 {path, text}
  html: {},              // 每块上次渲染的 HTML，没变就不重画（不闪、不丢滚动位置）
};
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nowS = () => Date.now() / 1000;

// 本机记住"知道了"的提醒（只存在这个浏览器里；读写失败也不影响页面）
function loadDismissed() { try { return JSON.parse(localStorage.getItem('board.dismissed') || '{}'); } catch (e) { return {}; } }
function saveDismissed(d) { try { localStorage.setItem('board.dismissed', JSON.stringify(d)); } catch (e) {} }
let dismissed = loadDismissed();

// 时间显示：多久以前、持续多久、几点
function ago(t) {
  if (!t) return '';
  const d = Math.max(0, nowS() - t);
  if (d < 45) return '刚刚';
  if (d < 3600) return Math.round(d / 60) + ' 分钟前';
  if (d < 86400) return Math.round(d / 3600) + ' 小时前';
  return Math.round(d / 86400) + ' 天前';
}
function dur(s) {
  if (s == null) return '—';
  s = Math.max(0, Math.round(s));
  if (s < 60) return s + ' 秒';
  if (s < 3600) return Math.floor(s / 60) + ' 分 ' + (s % 60) + ' 秒';
  return Math.floor(s / 3600) + ' 小时 ' + Math.floor((s % 3600) / 60) + ' 分';
}
function clock(s) {   // 12:05 这种计时器格式
  s = Math.max(0, Math.round(s || 0));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0');
}
function hm(t) { if (!t) return ''; const d = new Date(t * 1000); return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
function tm(t) { if (!t) return ''; const d = new Date(t * 1000); return [d.getHours(), d.getMinutes(), d.getSeconds()].map(x => String(x).padStart(2, '0')).join(':'); }
function ktok(n) { if (!n) return '—'; return n >= 1000 ? (n / 1000).toFixed(n >= 100000 ? 0 : 1) + 'k' : String(n); }
const WORKER = { codex: 'Codex', opencode: 'OpenCode', qunxian: '群贤', claude: 'Claude' };
function who(w, m, e) {
  const parts = [WORKER[w] || w || '?'];
  if (m) parts.push(String(m).split('/').pop());
  if (e && e !== '默认') parts.push(e);
  return parts.join(' · ');
}
// 带超时的请求：10 秒没回来就放弃，不让页面一直挂着
async function getJSON(url) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 10000);
  try {
    const r = await fetch(url, { cache: 'no-store', signal: ctl.signal });
    let d = null;
    try { d = await r.json(); } catch (e) { throw new Error('服务返回的不是数据（HTTP ' + r.status + '）'); }
    return { ok: r.ok, status: r.status, d };
  } catch (e) {
    throw new Error(e.name === 'AbortError' ? '10 秒没响应' : (e.message || String(e)));
  } finally { clearTimeout(timer); }
}
// 页面出错时记进看板的运行日志，方便事后查原因（只发错误信息，不发任何数据）
function report(where, e) {
  try { fetch('/api/log?m=' + encodeURIComponent((where + '：' + (e && (e.stack || e.message) || e)).slice(0, 800))); } catch (x) {}
}
window.addEventListener('error', (ev) => report('页面错误', ev.error || ev.message));
window.addEventListener('unhandledrejection', (ev) => report('未处理的异步错误', ev.reason));

// 某一块的 HTML 变了才替换
function put(id, html) { if (S.html[id] !== html) { $(id).innerHTML = html; S.html[id] = html; } }

// ================= 2. 拉数据（每 3 秒；页面在后台时每 15 秒） =================
async function poll() {
  try {
    const res = await getJSON('/api/state?project=' + encodeURIComponent(S.project));
    if (!res.ok) throw new Error('HTTP ' + res.status);
    S.data = res.d;
    S.lastOk = Date.now(); S.failing = false;
    render();
  } catch (e) {
    S.failing = true;
  }
  renderLive();
  setTimeout(poll, document.hidden ? 15000 : 3000);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) { renderLive(); } });

// ================= 3. 画四块 =================
function render() {
  const d = S.data; if (!d) return;
  renderProjects(d); renderHealth(d.健康 || {}); renderAttention(d.要你处理 || []);
  renderRunning(d.正在干活 || []); renderRecent(d.最近完成 || []);
  tick();
}

function renderLive() {
  const el = $('live');
  if (S.failing) {
    el.className = 'pill dead';
    el.innerHTML = '<i class="dot"></i>连不上看板服务' + (S.lastOk ? ' · 上次更新 ' + ago(S.lastOk / 1000) : '');
  } else if (S.lastOk) {
    el.className = 'pill live';
    el.innerHTML = '<i class="dot pulse"></i>实时';
  }
}

function renderProjects(d) {
  const opts = [{ 名字: '全部', 件数: null }].concat(d.项目列表 || []);
  if (!opts.some(p => p.名字 === S.project)) opts.push({ 名字: S.project, 件数: 0 });
  put('project', opts.map(p => '<option value="' + esc(p.名字) + '"' + (p.名字 === S.project ? ' selected' : '') + '>' +
    esc(p.名字 === '全部' ? '全部项目（不含测试）' : p.名字 + (p.件数 != null ? '（' + p.件数 + '）' : '')) + '</option>').join(''));
}

// 每个数值显示上次成功时间；失败原因独立展示，保留原数值与成功时间。
function healthAge(item) {
  return item && item.更新时间 != null
    ? '<span data-health-updated="' + esc(item.更新时间) + '">' + Math.max(0, Math.floor(nowS() - item.更新时间)) + ' 秒前更新</span>'
    : '<span>尚未成功更新</span>';
}
function healthError(item) {
  return item && item.错误 ? '<span class="muted">查询失败（' + esc(item.错误) + '）</span>' : '';
}
function renderHealth(h) {
  const chips = [];
  // Codex 额度由 app-server 每分钟查询，失败时颜色提醒但不清空上次值。
  const q = h.codex;
  if (q && q.已用 != null) {
    const lv = q.已用 >= 90 ? 'bad' : q.错误 || q.已用 >= 70 ? 'warn' : 'ok';
    chips.push('<div class="chip ' + lv + '"><i class="dot"></i><b>Codex 额度</b>' +
      '<div class="meter"><i style="width:' + Math.min(100, q.已用) + '%"></i></div>已用 ' + esc(q.已用) + '%' + healthAge(q) +
      (q.重置 ? '<span>· ' + esc(hm(q.重置)) + ' 重置</span>' : '') + healthError(q) + '</div>');
  } else {
    chips.push('<div class="chip unk"><i class="dot"></i><b>Codex 额度</b><span>暂无数据</span>' + healthAge(q) + healthError(q) + '</div>');
  }
  // 余额同时显示更新时间与错误；币种来自官方响应，避免把美元标成人民币。
  for (const b of (h.余额 || [])) {
    if (b.余额 != null) {
      const lv = b.错误 || b.余额 < 10 ? 'warn' : 'ok';
      const currency = b.币种 === 'CNY' ? '¥' : b.币种 === 'USD' ? '$' : (b.币种 || '') + ' ';
      chips.push('<div class="chip ' + lv + '"><i class="dot"></i><b>' + esc(b.名字) + '</b>' + esc(currency) + Number(b.余额).toFixed(2) + healthAge(b) + healthError(b) + '</div>');
    } else {
      chips.push('<div class="chip unk"><i class="dot"></i><b>' + esc(b.名字) + '</b>' +
        (b.说明 ? '<span>' + esc(b.说明) + '</span>' : healthAge(b) + healthError(b)) + '</div>');
    }
  }
  // 日审只报告公共库核对的证据，不把证据核对宣传成整机安全审计。
  const a = h.日审;
  if (a) {
    const bad = (a.问题 || []).length;
    const warnings = (a.提醒 || []).length;
    const lv = bad ? 'bad' : warnings ? 'warn' : 'ok';
    chips.push('<div class="chip ' + lv + '" title="核对完成卡与最新回执，每小时运行"><i class="dot"></i><b>日审 · 证据核对</b>' +
      esc(a.核对卡数) + ' 张卡，' + bad + ' 个问题' + (warnings ? '，' + warnings + ' 个提醒' : '') +
      '<span>· ' + esc(ago(a.时间)) + '</span></div>');
  } else {
    chips.push('<div class="chip unk"><i class="dot"></i><b>日审</b><span>正在首次核对</span></div>');
  }
  put('health', chips.join(''));
}

// 每秒刷新计时器、进度条、"多久以前"，不用重新拉数据
function tick() {
  const t = nowS();
  document.querySelectorAll('[data-health-updated]').forEach(el => { el.textContent = Math.max(0, Math.floor(t - Number(el.dataset.healthUpdated))) + ' 秒前更新'; });
  document.querySelectorAll('[data-since]').forEach(el => { const s = +el.dataset.since; if (s) el.textContent = clock(t - s); });
  document.querySelectorAll('.prog[data-start]').forEach(el => {
    const p = Math.min(100, (t - +el.dataset.start) / +el.dataset.timeout * 100);
    el.firstChild.style.width = p.toFixed(1) + '%';
    el.classList.toggle('late', p > 80);
  });
  document.querySelectorAll('[data-ago]').forEach(el => { const s = +el.dataset.ago; if (s) el.textContent = ago(s); });
}
setInterval(() => { tick(); if (S.failing) renderLive(); }, 1000);

// ================= 4. 详情抽屉 =================
const TABS = [['progress', '进展'], ['result', '交付说明'], ['card', '任务卡'], ['receipt', '回执'], ['files', '文件'], ['kanban', '账本记录']];
const STATE_TEXT = { running: '进行中', done: '执行完成', timeout: '超时', failed: '失败', interrupted: '中断' };
const ICON = { start: '▶', tool: '⚙', out: '✓', warn: '✗', say: '💬', think: '·', edit: '✎', end: '■', error: '⚠' };
let drawerTimer = null;

function openTask(id, round, tab) {
  S.open = { id, round: round || '', tab: tab || 'progress' };
  S.fileView = null; S.detail = null; S.html.dh = S.html.db = null;
  $('drawer').classList.add('on'); $('shade').classList.add('on'); $('drawer').setAttribute('aria-hidden', 'false');
  $('dh').innerHTML = '<button class="x" data-close="1" aria-label="关闭">×</button><h3>加载中…</h3>'; $('db').innerHTML = '';
  writeHash(); loadDetail();
}
function closeTask() {
  S.open = null; S.detail = null; clearTimeout(drawerTimer);
  $('drawer').classList.remove('on'); $('shade').classList.remove('on'); $('drawer').setAttribute('aria-hidden', 'true');
  writeHash();
}
async function loadDetail() {
  clearTimeout(drawerTimer);
  if (!S.open) return;
  const id = S.open.id;
  let failed = false;
  try {
    const res = await getJSON('/api/task?id=' + encodeURIComponent(id));
    if (!S.open || S.open.id !== id) return;          // 等结果的时候已经换了别的任务
    if (!res.ok) { $('dh').innerHTML = '<button class="x" data-close="1">×</button><h3>' + esc((res.d && res.d.错误) || '读取失败（HTTP ' + res.status + '）') + '</h3>'; S.html.dh = null; return; }
    S.detail = res.d;
    if (!S.open.round || !S.detail.轮次.some(x => x.轮次 === S.open.round)) S.open.round = S.detail.轮次.length ? S.detail.轮次[S.detail.轮次.length - 1].轮次 : '';
    renderDrawer();
  } catch (e) {
    failed = true;
    report('打开任务 ' + id, e);
    if (!S.open || S.open.id !== id) return;
    // 第一次就失败：把"加载中"换成原因；已经显示过内容的，就在正文顶上提示，不清掉内容
    const msg = '读取失败：' + esc(e.message || String(e)) + '。5 秒后自动重试。';
    if (!S.detail || S.detail.任务 !== id) { $('dh').innerHTML = '<button class="x" data-close="1">×</button><h3>' + msg + '</h3>'; S.html.dh = null; }
    else { $('db').insertAdjacentHTML('afterbegin', '<div class="box amber">' + msg + '</div>'); S.html.db = null; }
  }
  if (!S.open || S.open.id !== id) return;
  const cur = S.detail && S.detail.任务 === id && S.detail.轮次.find(x => x.轮次 === S.open.round);
  drawerTimer = setTimeout(loadDetail, failed ? 5000 : (cur && cur.状态 === 'running' ? 2000 : 15000));
}

function renderDrawer() {
  const d = S.detail, o = S.open; if (!d || !o) return;
  const r = d.轮次.find(x => x.轮次 === o.round) || null;
  // 头部：标题、任务号、项目、结论、轮次切换、关键数字

  if (d.轮次.length) {

  if (r) {

    const tok = r.用量 ? ktok(r.用量.输入) + ' 入 / ' + ktok(r.用量.输出) + ' 出' : '—';
    h += '<div class="facts">' +
      '<div><span>谁做的</span>' + esc(who(r.工人, r.模型, r.档位)) + '</div>' +

      '<div><span>用时</span>' + (r.状态 === 'running' ? '<b data-since="' + r.开始 + '">' + clock(secs) + '</b>' + (r.超时秒 ? ' / ' + clock(r.超时秒) : '') : dur(secs)) + '</div>' +
      '<div><span>步数</span>' + (r.步数 || 0) + '</div>' +
      '<div><span>tokens</span>' + tok + '</div>' +
      '<div><span>费用</span>' + (r.费用 != null ? '$' + r.费用.toFixed(4) : r.工人 === 'codex' ? '订阅额度' : '—') + '</div>' +
      (r.退出码 != null ? '<div><span>退出码</span>' + esc(r.退出码) + '</div>' : '') + '</div>';
  }
  h += '<div class="tabs">' + TABS.map(([k, n]) => '<button class="tab' + (o.tab === k ? ' on' : '') + '" data-tab-pick="' + k + '">' + n + '</button>').join('') + '</div>';
  if (S.html.dh !== h) { $('dh').innerHTML = h; S.html.dh = h; }

  // 正文：按标签页
  const body = $('db');
  const atBottom = body.scrollHeight - body.scrollTop - body.clientHeight < 40;
  let b = '';
  if (!r && o.tab !== 'kanban') b = '<div class="muted">这件活还没有执行记录（只有登记记录）。</div>';
  else if (o.tab === 'progress') {
    b = (r.状态 === 'running' ? '<div class="box blue"><i class="dot pulse" style="color:var(--done)"></i> 正在干活，每 2 秒自动更新</div>' : '') +
      (r.时间线总数 > r.时间线.length ? '<div class="muted" style="font-size:12px;margin-bottom:6px">共 ' + r.时间线总数 + ' 条，只显示最后 ' + r.时间线.length + ' 条</div>' : '') +
      (r.时间线.length ? '<ul class="tl">' + r.时间线.map(x => '<li class="' + esc(x.k) + '"><span class="ic">' + (ICON[x.k] || '·') + '</span><span class="s">' + esc(x.s) + '</span><span class="tm">' + esc(tm(x.t)) + '</span>' +
        (x.d ? '<details><summary>细节</summary><pre>' + esc(x.d) + '</pre></details>' : '') + '</li>').join('') + '</ul>' : '<div class="muted">还没有动静。</div>');
  } else if (o.tab === 'result') {
    if (r.需输入) b += '<div class="box amber"><h4>工人停下来等输入</h4>' + esc(r.需输入) + '</div>';
    if (r.决策披露) b += '<div class="box blue"><h4>决策披露（工人自己做主的地方）</h4><pre>' + esc(r.决策披露) + '</pre></div>';
    if (r.验收) b += '<div class="box gray">验收结论：<b>' + esc(r.验收) + '</b>（由派活的大脑核对证据后给出，不是工人自评）</div>';
    b += r.交付说明 ? '<pre class="doc">' + esc(r.交付说明) + '</pre>' : '<div class="muted">' + (r.状态 === 'running' ? '还在干活，做完才有交付说明。' : '没有交付说明（结果.txt）。') + '</div>';
  } else if (o.tab === 'card') {
    b = r.任务卡 ? '<pre class="doc">' + esc(r.任务卡) + '</pre>' : '<div class="muted">没找到任务卡。</div>';
  } else if (o.tab === 'receipt') {
    b = r.回执 ? '<div class="box gray">回执由执行脚本写，只记录机器能核对的事实（退出码、用时、用量、结果文件的校验码），不含"验收通过"这种判断。</div><pre class="doc">' + esc(JSON.stringify(r.回执, null, 2)) + '</pre>'
      : '<div class="muted">' + (r.状态 === 'running' ? '还在干活，结束后才有回执。' : '没有回执：这一轮没有正常结束。') + '</div>';
  } else if (o.tab === 'files') {
    if (S.fileView) {
      b = '<div style="margin-bottom:8px"><button class="linkbtn" data-file-back="1">← 返回文件列表</button> <b style="margin-left:8px">' + esc(S.fileView.path) + '</b></div>' +
        '<pre class="doc">' + esc(S.fileView.text) + '</pre>';
    } else {
      b = '<div class="muted" style="font-size:12px;margin-bottom:6px">本轮目录里的文件（工人只能在这里读写）。点文件名查看。</div><ul class="files">' +
        r.文件.map(f => '<li><button class="linkbtn" data-file="' + esc(f.路径) + '">' + esc(f.路径) + '</button><span class="muted">' + fsize(f.大小) + '</span></li>').join('') + '</ul>';
    }
  } else if (o.tab === 'kanban') {
    const k = d.看板;
    if (!k) b = '<div class="muted">这件活没有账本登记记录。</div>';
    else {
      b = '<div class="kv"><div><span>卡号</span>' + esc(k.卡号) + '</div><div><span>状态</span>' + esc(k.状态) + '</div>' +
        '<div><span>派给</span>' + esc(k.派给) + '</div><div><span>派活人</span>' + esc(k.派活人) + '</div>' +
        (k.卡住原因 ? '<div><span>卡住原因</span>' + esc(k.卡住原因) + '</div>' : '') + '</div>';
      if (k.执行记录 && k.执行记录.length) b += '<h4 style="margin:16px 0 6px">完成记录</h4><ul class="tl">' + k.执行记录.map(x => '<li><span class="ic">' + (x.结果 === 'completed' ? '✓' : '■') + '</span><span class="s">' + esc(x.摘要 || x.结果 || '') + (x.附加 ? '\n' + esc(JSON.stringify(x.附加)) : '') + '</span><span class="tm">' + esc(hm(x.结束)) + '</span></li>').join('') + '</ul>';
      if (k.留言 && k.留言.length) b += '<h4 style="margin:16px 0 6px">留言</h4><ul class="tl">' + k.留言.map(x => '<li><span class="ic">💬</span><span class="s">' + esc(x.内容) + '</span><span class="tm">' + esc(hm(x.时间)) + '</span></li>').join('') + '</ul>';
      // 账本每条事件完整展示在可展开细节中，保留原布局并继续对文字做转义。
      b += '<h4 style="margin:16px 0 6px">事件</h4><ul class="tl">' + k.事件.map(x => '<li><span class="ic">·</span><span class="s">' + esc(x.类型) + '<details><summary>细节</summary><pre>' + esc(JSON.stringify(x.内容, null, 2)) + '</pre></details></span><span class="tm">' + esc(hm(x.时间)) + '</span></li>').join('') + '</ul>';
    }
  }
  if (S.html.db !== b) {
    const keepTop = body.scrollTop;
    body.innerHTML = b; S.html.db = b;
    // 进展页：本来就在底部就跟着滚到最新；不在底部就保持原位（方便往回看）
    body.scrollTop = (o.tab === 'progress' && atBottom) ? body.scrollHeight : keepTop;
  }
  tick();
}
function fsize(n) { return n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(1) + ' KB' : (n / 1048576).toFixed(1) + ' MB'; }

async function openFile(path) {
  const o = S.open; if (!o) return;
  try {
    const r = await fetch('/api/file?id=' + encodeURIComponent(o.id) + '&round=' + encodeURIComponent(o.round) + '&path=' + encodeURIComponent(path));
    const d = await r.json();
    S.fileView = { path, text: d.内容 != null ? d.内容 : (d.错误 || '读不到') };
  } catch (e) { S.fileView = { path, text: '读不到：' + e }; }
  renderDrawer(); $('db').scrollTop = 0;
}

// ================= 5. 地址栏记住状态（刷新页面后还在原来的位置） =================
function writeHash() {
  const p = new URLSearchParams();
  if (S.project !== '全部') p.set('p', S.project);
  if (S.open) { p.set('t', S.open.id); if (S.open.round) p.set('r', S.open.round); p.set('v', S.open.tab); }
  const h = p.toString();
  history.replaceState(null, '', h ? '#' + h : location.pathname);
}
function readHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  const proj = p.get('p') || '全部';
  if (proj !== S.project) { S.project = proj; S.html = {}; if (S.data) poll0(); }
  if (p.get('t')) openTask(p.get('t'), p.get('r'), p.get('v'));
  else if (S.open) closeTask();
}
// 手动改地址、点浏览器后退时，按新地址打开对应的任务
window.addEventListener('hashchange', readHash);

// ================= 6. 点击和键盘 =================
document.addEventListener('click', (ev) => {
  const t = ev.target.closest('[data-open],[data-dismiss],[data-undismiss],[data-morerecent],[data-close],[data-round-pick],[data-tab-pick],[data-file],[data-file-back]');
  if (!t) return;
  const ds = t.dataset;
  if (ds.dismiss) { dismissed[ds.dismiss] = Date.now(); saveDismissed(dismissed); render(); ev.stopPropagation(); return; }
  if (ds.undismiss) { dismissed = {}; saveDismissed(dismissed); render(); return; }
  if (ds.morerecent) { S.showAllRecent = !S.showAllRecent; render(); return; }
  if (ds.close) { closeTask(); return; }
  if (ds.roundPick) { S.open.round = ds.roundPick; S.fileView = null; writeHash(); renderDrawer(); loadDetail(); return; }
  if (ds.tabPick) { S.open.tab = ds.tabPick; S.fileView = null; writeHash(); renderDrawer(); return; }
  if (ds.file) { openFile(ds.file); return; }
  if (ds.fileBack) { S.fileView = null; renderDrawer(); return; }
  if (ds.open) { openTask(ds.open, ds.round, ds.tab); }
});
$('shade').addEventListener('click', closeTask);
document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape' && S.open) closeTask(); });
$('project').addEventListener('change', (ev) => { S.project = ev.target.value; S.html = {}; writeHash(); S.data = null; poll0(); });

// 切项目时立刻拉一次（不打乱 3 秒一次的节奏）
async function poll0() {
  try { const res = await getJSON('/api/state?project=' + encodeURIComponent(S.project)); if (!res.ok) throw new Error('HTTP ' + res.status); S.data = res.d; S.lastOk = Date.now(); S.failing = false; render(); } catch (e) { S.failing = true; report('切换项目', e); }
  renderLive();
}

readHash();
poll();
</script>
